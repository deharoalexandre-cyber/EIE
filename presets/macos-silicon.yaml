# EIE Preset : macOS Apple Silicon (Metal)
# Toutes les couches sur le GPU (défaut du moteur sur Apple Silicon), cache KV f16, contexte 4096.
host: 127.0.0.1
port: 8090
strategy: generic
model_dir: models
auto_discover: true
preload: all
type_k: f16
type_v: f16
flash_attn: false
n_ctx: 4096
reserve_mb: 256
log_level: info

groups:
  - name: core
    models: [gemma-4-E2B-it-QAT-Q4_0]
    required_responses: 1
    type: parallel
